<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中信主观产品对比 · 维纳1号</title>
<style>
:root{--red:#C7000B;--dark:#7a0c14;--gold:#b8860b;--goldbg:#fff8e6;--line:#e5e0dc;--pos:#d43d2a;--neg:#1a9e54;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#faf8f6;color:#2b2b2b;font-size:13px;}
.wrap{max-width:1560px;margin:0 auto;padding:18px 22px 40px;}
h1{font-size:22px;color:var(--dark);letter-spacing:1px;}
.meta{color:#8a7f78;font-size:12px;margin:6px 0 16px;line-height:1.7;}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px;box-shadow:0 1px 4px rgba(90,60,40,.04);}
.whead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.whead .nm{font-size:18px;font-weight:700;color:var(--gold);}
.whead .nv{font-size:16px;font-weight:600;}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;}
.chip{background:var(--goldbg);border:1px solid #ecd9ac;border-radius:8px;padding:8px 10px;}
.chip .lb{font-size:11px;color:#96805a;}
.chip .vl{font-size:16px;font-weight:700;margin-top:2px;}
.sec{margin-top:26px;}
.sec h2{font-size:16px;color:var(--dark);border-left:4px solid var(--red);padding-left:9px;margin-bottom:10px;}
.sec h2 small{color:#a08f85;font-weight:400;font-size:12px;margin-left:8px;}
.toolbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px;color:#8a7f78;font-size:12px;flex-wrap:wrap;}
select{padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#444;}
.tblwrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:1240px;}
th{background:var(--red);color:#fff;font-weight:500;font-size:12px;padding:7px 8px;white-space:nowrap;text-align:center;}
td{padding:6px 8px;border-bottom:1px solid #f0e9e4;text-align:center;white-space:nowrap;}
td.l{text-align:left;}
tbody tr:nth-child(even){background:#fcf9f7;}
tbody tr:hover{background:#f6eee9;}
tr.weina{background:var(--goldbg)!important;font-weight:600;}
tr.weina td{border-top:1px solid #e3cf9d;border-bottom:1px solid #e3cf9d;}
.pos{color:var(--pos);} .neg{color:var(--neg);}
.tag{display:inline-block;background:#f3e7e4;color:#8a4b3c;border-radius:4px;padding:0 5px;font-size:11px;}
.chart{display:flex;flex-direction:column;gap:3px;margin:8px 0 4px;}
.barrow{display:grid;grid-template-columns:210px 1fr 62px;align-items:center;gap:8px;font-size:12px;}
.barwrap{height:13px;background:#f4efec;border-radius:3px;position:relative;}
.bar{position:absolute;top:0;bottom:0;background:var(--red);border-radius:3px;opacity:.82;}
.bar.negbar{background:var(--neg);}
.bar.wbar{background:var(--gold);opacity:1;}
.barval{font-weight:600;text-align:right;}
.zero{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#cbb9ac;}
.note{color:#a08f85;font-size:11px;margin-top:18px;line-height:1.8;}
a.home{color:var(--red);font-size:12px;text-decoration:none;}
</style>
</head>

  <div class="toolbar">排序指标：

      <option value="ann">成立以来年化收益</option>

    <span>每组表格首行固定维纳1号（金色）作对照；图表为今年以来收益，金色为维纳1号。</span>
    <a class="home" href="index.html">← 返回同业对比看板</a>

</div>

  y1r:"近一年收益",y1dd:"近一年最大回撤",y1sharpe:"近一年年化夏普",
  ann:"成立以来年化收益",dd:"成立以来最大回撤",sharpe:"成立以去年化夏普",calmar:"成立以去年化卡玛"
};
const COLS = ["mg","pm","scale","name","inc","nav","w1","m1","ytd","y1r","y1dd","y1sharpe","ann","dd","sharpe","calmar"];
const PCT = new Set(["w1","m1","ytd","y1r","y1dd","ann","dd"]);
const RATIO = new Set(["y1sharpe","sharpe","calmar"]);
const WKEYS = ["mg","pm","scale","name","inc","nav","w1","m1","ytd","y1r","y1dd","y1sharpe","ann","dd","sharpe","calmar"];
const fmtPct = v => v==null?"—":(v>0?"+":"")+v.toFixed(2)+"%";
const fmtRat = v => v==null?"—":v.toFixed(2);
const cls = v => v==null?"":(v>=0?"pos":"neg");
const cell = (k,v) => PCT.has(k)?`<td class="${cls(v)}">${fmtPct(v)}</td>`:RATIO.has(k)?`<td>${fmtRat(v)}</td>`:k==="nav"?`<td>${v}</td>`:k==="name"?`<td class="l">${v}</td>`:`<td>${v}</td>`;
const rowOf = (r,weina) => {
  const o = Object.fromEntries(WKEYS.map((k,i)=>[k,r[i]]));
  return `<tr${weina?' class="weina"':''}>${COLS.map(k=>cell(k,o[k])).join("")}</tr>`;
};
document.getElementById("meta").textContent =
  `截至 ${DATA.asOf} · ${DATA.groups.reduce((s,g)=>s+g.rows.length,0)} 只中信主观产品 · 来源：${DATA.source}；维纳1号净值截至${DATA.asOf}`;
document.getElementById("weinaCard").innerHTML = `

    const isPct = !["近一年夏普","成立以来夏普","成立以来卡玛"].includes(lb);
    return `<div class="chip"><div class="lb">${lb}</div><div class="vl ${isPct?cls(v):""}">${isPct?fmtPct(v):fmtRat(v)}</div></div>`;
  }).join("")}</div>`;
function render(sortKey){
  const desc = sortKey!=="w1";
  document.getElementById("secs").innerHTML = DATA.groups.map(g=>{
    const rows = [...g.rows];
    if(desc) rows.sort((a,b)=>b[WKEYS.indexOf(sortKey)]-a[WKEYS.indexOf(sortKey)]);
    const chartRows = [...rows, WKEYS.map(k=>W[k])];
    const vals = chartRows.map(r=>r[WKEYS.indexOf("ytd")]);
    const maxAbs = Math.max(...vals.map(v=>Math.abs(v)),1);
    const chart = chartRows.map(r=>{
      const i = WKEYS.indexOf("ytd"), v = r[i], isW = r[WKEYS.indexOf("name")]==="维纳1号";
      const w = Math.abs(v)/maxAbs*50;
      const left = v>=0?50:50-w;
      return `<div class="barrow"><div class="l" style="overflow:hidden;text-overflow:ellipsis;">${r[WKEYS.indexOf("name")]}</div>
        <div class="barwrap"><div class="zero"></div><div class="bar ${isW?"wbar":v<0?"negbar":""}" style="left:${left}%;width:${w}%;"></div></div>
        <div class="barval ${cls(v)}">${fmtPct(v)}</div></div>`;
    }).join("");
    return `<div class="sec panel"><h2>${g.style}风格产品<small>${g.rows.length} 只 · 今年以来收益对比</small></h2>
      <div class="chart">${chart}</div>
      <div class="tblwrap"><table><thead><tr>${COLS.map(k=>`<th>${F[k]}</th>`).join("")}</tr></thead>
      <tbody>${rowOf(WKEYS.map(k=>W[k]),true)}${rows.map(r=>rowOf(r,false)).join("")}</tbody></table></div></div>`;
  }).join("");
}
document.getElementById("sortSel").addEventListener("change", e=>render(e.target.value));
render("w1");
</script>
